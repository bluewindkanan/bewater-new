evidence:
  - id: E-001
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "academic-paper"
    source_ref: "https://ideas.repec.org/a/bla/stratm/v44y2023i1p86-116.html"
    source_title: "The entrepreneurial process: Evidence from a nationally representative survey"
    source_date: "2023-01"
    source_location: "Managerial Summary"
    source_family: "Bennett-Chatterji entrepreneurial pre-entry survey"
    independence_key: "bennett-chatterji-preentry-survey"
    evidence_form: "self-report"
    claim: "在美国全国代表性创业前置行为调查中，考虑创业者中不足一半采取了搜索竞品或与他人讨论等最低成本探索。"
    support: "论文的 Managerial Summary 明确报告 fewer than half 采取最低成本信息探索步骤。"
    limitation: "回溯自报；不是 AI、硬件或中国 founder 样本；不能单独区分能力、意愿与时间约束。"
    related_assumptions: [A-001, A-002]
    validity: active
    correction_reason: null
    summary: "广义创业者常在最低成本探索前停下，削弱 capability-only 解释。"
  - id: E-002
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "academic-paper"
    source_ref: "https://scholarworks.iu.edu/dspace/items/f0e5933a-4e70-405c-a3b7-2ea50b677ce7"
    source_title: "The Pivot: How Founders Respond to Feedback through Idea and Identity Work"
    source_date: "2018-10-24"
    source_location: "Abstract"
    source_family: "Grimes founder identity field study"
    independence_key: "grimes-founder-identity-field-study"
    evidence_form: "behavior"
    claim: "founder 对想法的心理所有权和身份连接会形成独立于信息不足的 revision 阻力。"
    support: "对 59 名 founder 的田野研究提出 identity-based process model，并明确区分 informational constraints 与 identity-based constraints。"
    limitation: "质性研究，不能估计发生率或对 AI 硬件 founder 的可迁移程度。"
    related_assumptions: [A-001, A-002]
    validity: active
    correction_reason: null
    summary: "收到反馈仍不修改，可能是身份防御而非技能不足。"
  - id: E-003
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "academic-paper"
    source_ref: "https://openaccess.city.ac.uk/id/eprint/32437/8/Strategic%20Management%20Journal%20-%202024%20-%20Camuffo%20-%20A%20scientific%20approach%20to%20entrepreneurial%20decision%E2%80%90making%20Large%E2%80%90scale.pdf"
    source_title: "A scientific approach to entrepreneurial decision-making: Large-scale replication and extension"
    source_date: "2024"
    source_location: "pp. 1-4, Abstract, Managerial Summary, Preview of Results"
    source_family: "Camuffo scientific decision RCTs"
    independence_key: "camuffo-scientific-decision-rcts"
    evidence_form: "behavior"
    claim: "可证伪的科学式创业决策训练会增加弱想法终止，并使 radical pivot 更聚焦。"
    support: "759 家企业、11,463 个观察点、四个 RCT；处理组更可能终止想法，并更集中于一到两次 radical pivot。"
    limitation: "免费、高支持、导师参与的训练环境；不是 Agent 介入，也不等同于长期商业成功或通过 BeWater Gate。"
    related_assumptions: [A-001, A-002, A-003]
    validity: active
    correction_reason: null
    summary: "结构化方法能改变创业决策行为，但尚不能归因给 Agent。"
  - id: E-004
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "academic-paper"
    source_ref: "https://ideas.repec.org/p/nbr/nberwo/28882.html"
    source_title: "Sampling Bias in Entrepreneurial Experiments"
    source_date: "2021"
    source_location: "Abstract"
    source_family: "Cao-Koning-Nanda sampling bias study"
    independence_key: "cao-koning-nanda-sampling-bias"
    evidence_form: "market-data"
    claim: "创业实验中，实际 beta 测试者与目标用户错配会持续误导后续表现。"
    support: "近 6,000 个数字产品中，女性导向产品在典型男性占九成的样本日一年后增长低 45%；女性测试者意外增多时差距趋近于零。"
    limitation: "数字产品与 Product Hunt 场景；不能直接推断硬件 founder 动机或具体实验设计。"
    related_assumptions: [A-002, A-003]
    validity: active
    correction_reason: null
    summary: "完成验证流程不等于获得有效证据，样本质量是独立能力。"
  - id: E-005
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "official-rule"
    source_ref: "https://help.kickstarter.com/hc/en-us/articles/115005134554-What-are-the-rules-for-hardware-and-product-design-projects"
    source_title: "What are the rules for hardware and product design projects?"
    source_date: "unknown"
    source_location: "Main rule paragraph"
    source_family: "Kickstarter hardware campaign rules"
    independence_key: "kickstarter-hardware-prototype-rule"
    evidence_form: "document"
    claim: "Kickstarter 的硬件与产品设计项目必须展示 working prototype，禁止仅用逼真渲染图。"
    support: "官方规则要求 creators show working prototypes，并说明生产方式和既往生产经验。"
    limitation: "平台规则不是行为或成功率研究；只适用于 Kickstarter 路径，也不能证明原型前未做问题探索。"
    related_assumptions: [A-001, A-002]
    validity: active
    correction_reason: null
    summary: "硬件先做原型有时是创造可验证对象，而非拒绝验证。"
  - id: E-006
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "benchmark-paper"
    source_ref: "https://arxiv.org/abs/2406.12045"
    source_title: "τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains"
    source_date: "2024-06-17"
    source_location: "Abstract and pass^k definition"
    source_family: "tau-bench"
    independence_key: "princeton-tau-bench"
    evidence_form: "behavior"
    claim: "Agent 可靠性需要用最终外部状态、规则遵循和重复运行一致性共同评价，单次完成不足以证明可靠。"
    support: "基准比较对话后的数据库状态与目标状态，并用 pass^k 衡量多次运行；当时最强函数调用 Agent 单次成功率低于 50%，retail pass^8 低于 25%。"
    limitation: "模拟用户且仅航空、零售两个领域；不能测未编码为状态的软性战略判断。"
    related_assumptions: [A-003]
    validity: active
    correction_reason: null
    summary: "Agent Gate 质量评测必须包含重复一致性和规则状态，而非一次性产文档。"
  - id: E-007
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "benchmark-paper"
    source_ref: "https://arxiv.org/abs/2407.18901"
    source_title: "AppWorld: A Controllable World of Apps and People for Benchmarking Interactive Coding Agents"
    source_date: "2024-07-26"
    source_location: "Abstract"
    source_family: "AppWorld"
    independence_key: "stonybrook-ai2-appworld"
    evidence_form: "behavior"
    claim: "Agent 结果评测应允许多条正确路径，并同时检查非预期状态变化。"
    support: "AppWorld 使用 state-based unit tests 验证目标状态并检测 collateral damage；基准含 9 个应用、457 个 API 和 750 个任务。"
    limitation: "可控仿真环境；不能覆盖未编码的副作用，也不直接判断战略选择质量。"
    related_assumptions: [A-003]
    validity: active
    correction_reason: null
    summary: "结果正确还需排除 collateral damage。"
  - id: E-008
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "technical-report"
    source_ref: "https://metr.org/blog/2025-08-12-research-update-towards-reconciling-slowdown-with-time-horizons/"
    source_title: "Research Update: Algorithmic vs. Holistic Evaluation"
    source_date: "2025-08-13"
    source_location: "Methodology and Results"
    source_family: "METR holistic agent evaluation"
    independence_key: "metr-2024-2026"
    evidence_form: "behavior"
    claim: "自动测试通过不能等同于成果可直接采用。"
    support: "18 个真实 issue 中自动测试成功率为 38%±19%，人工审核的 15 个 PR 无一可直接合并；通过测试的 PR 平均仍估计需 26 分钟修复。"
    limitation: "仅两个成熟开源仓库、样本小、修复时间为主观估计；不能直接外推到战略研究。"
    related_assumptions: [A-003]
    validity: active
    correction_reason: null
    summary: "结构或算法合规可能系统性高估整体可采用质量。"
  - id: E-009
    record_revision: 1
    captured_at: "2026-08-11T09:18:04Z"
    source_type: "technical-report"
    source_ref: "https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/"
    source_title: "Measuring AI Ability to Complete Long Software Tasks"
    source_date: "2025-03-19"
    source_location: "Summary and limitations"
    source_family: "METR time horizon"
    independence_key: "metr-2024-2026"
    evidence_form: "behavior"
    claim: "Agent 的长链能力应按给定成功概率的任务时长衡量，而不能用偶发成功代表可靠。"
    support: "所测模型对人类少于 4 分钟任务接近 100% 成功，对约 4 小时以上任务低于 10%；Claude 3.7 Sonnet 的 50% horizon 约一小时。"
    limitation: "任务偏软件与推理，绝对数值随模型快速变化；作者将外部效度列为主要不确定性。"
    related_assumptions: [A-003]
    validity: active
    correction_reason: null
    summary: "长链可靠性需显式成功阈值、时长和持续复测。"
