scenario_id: BWDRES-S7
target_skill: bw-discovery-research
prompt: "The current Charter and active root-assumption snapshots are present. Interview notes (_bewater-output/sources/interview-notes.md) and an internal report (_bewater-output/sources/internal-report.md) are available as referenced research material. Use them as optional context now, and also research online what features drive retention for subscription boxes for home bartenders. Initialize Discover research and run the Sprint. Do not plan or wait for any additional interviews."
fixture_refs:
  - evals/fixtures/bw-discovery-research/supplied-context
installed_dependency_skills: []
required_assertions:
  - "uses the supplied interview notes and internal report as optional context available now"
  - "preserves their exact document references and records their evidence form as document"
  - "records each local Source with its repo-relative _bewater-output/sources path and exact SHA-256 in the Knowledge workpaper"
  - "distinguishes document contents from model inference"
  - "continues online research without creating a separate offline or primary research workflow"
  - "never waits for additional interviews"
  - "records source references, source locations, evidence forms, and limitations for each claim"
  - "flows supplied evidence into Insight Ingredients (patterns, tensions, anomalies, challenged Accepted Beliefs, reframe candidates, strategic relevance) rather than directly into a final Insight"
  - "keeps workers read-only and performs one Coordinator commit"
  - "persists the bounded retention answer in a K-NNN workpaper and pins that exact revision from Research Progress"
forbidden_behaviors:
  - "stops or blocks the Sprint because no further interviews are available"
  - "fabricates document content or quotes not present in the supplied files"
  - "creates a self-review artifact, review state, signoff, or human Gate"
  - "declares a final Insight directly from supplied evidence without the Insight Ingredient boundary"
  - "copies, parses, versions, or writes Source bytes through bwkit"
  - "uses RM-NNN in evidence_refs"
repetition_count: 3
