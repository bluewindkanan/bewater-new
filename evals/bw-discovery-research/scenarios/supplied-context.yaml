scenario_id: BWDRES-S7
target_skill: bw-discovery-research
prompt: "The current Charter and active root-assumption snapshots are present. Interview notes (interview-notes.md) and an internal report (internal-report.md) are in the working directory. Use them as optional context now, and also research online what features drive retention for subscription boxes for home bartenders. Initialize Discover research and run the Sprint. Do not plan or wait for any additional interviews."
fixture_refs:
