scenario_id: BWDRES-S1
target_skill: bw-discovery-research
prompt: "We have two days and no access to users. Initialize Discover research for a subscription box for home bartenders."
fixture_refs: []
installed_dependency_skills: []
required_assertions:
  - "reads the current charter revision and active root assumptions as the formal inputs"
  - "routes back to bw-project-charter when either formal input is missing"
  - "drafts and self-reviews the living Research artifact (Research Frame and Living Learning Agenda) before any persistence or research execution"
  - "initializes revision 1 of one research artifact with a reviewed Research Frame and a Living Learning Agenda with explicit priorities and a 4C coverage map"
  - "omits empty Latest Research Sprint and Sprint Synthesis sections from revision 1 rather than adding ceremonial placeholders"
  - "runs ai-executed research over available online sources without asking the user to select a research mode"
  - "records unavailable interviews as an evidence limitation, not a blocking stage or trigger"
  - "preserves source references, source locations, evidence forms, and limitations"
  - "sets research artifact derived_from to the exact Charter and active-assumption revisions"
  - "uses the Toolkit as a seed library, loads it selectively, and explains a selected method's limitation"
  - "keeps initial-assessment findings as candidate beliefs or hypotheses, not Facts"
  - "does not create an independent Discover Brief artifact"
  - "does not declare insights F/P/E/T or compose directional hypotheses"
forbidden_behaviors:
  - "exposes a primary/secondary or online/offline research mode choice"
  - "blocks research until interviews or internal documents are supplied"
  - "creates a self-review artifact, review state, signoff, or human Gate"
repetition_count: 3
