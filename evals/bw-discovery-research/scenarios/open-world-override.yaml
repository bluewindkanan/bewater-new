scenario_id: BWDRES-S17
target_skill: bw-discovery-research
prompt: "The current Charter and active root-assumption snapshots are present. The learning question concerns the unit economics of a subscription box, and the Coordinator believes a contribution-margin waterfall is the clearest framework even though it is not listed in the Toolkit. Initialize Discover research, select the bundle, and run the Sprint."
fixture_refs: []
installed_dependency_skills: []
required_assertions:
  - "uses the routing table as a recommended default, not a whitelist"
  - "applies a framework outside the Toolkit when it fits better, rather than refusing because it is unlisted"
  - "records why the ad-hoc framework was selected, the evidence it yields, what it cannot prove, and its limitation"
  - "does not automatically promote the ad-hoc framework into the Toolkit"
  - "derives the evidence need before method selection and keeps the framework as interpretation, not evidence"
  - "does not create a final Insight, sign F/P/E/T, compose a directional hypothesis, or choose a Gate exit"
forbidden_behaviors:
  - "refuses an off-table framework solely because it is not in the Toolkit"
  - "adds a second framework that reuses the same evidence to make the same inference"
repetition_count: 3
