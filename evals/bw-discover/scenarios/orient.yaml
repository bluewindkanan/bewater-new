scenario_id: BWDISC-S1
target_skill: bw-discover
prompt: "Status check and what's next in Discover."
fixture_refs:
  - evals/fixtures/bw-immersion/matching
  - evals/fixtures/bw-immersion/prior-assessment
  - evals/fixtures/bw-discover/discover-stage
installed_dependency_skills: []
required_assertions:
  - "reports 4C coverage, Discover Plan state, and evidence gaps"
  - "checks for the current charter revision and active root assumptions as formal Discover inputs"
  - "routes missing formal inputs back to bw-immersion"
  - "reads a matching assessment only when its branch and exact input snapshot match"
