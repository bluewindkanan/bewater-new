  - "reports the formal input revisions and does not invent a Discover Brief"
  - "routes to bw-discovery-research, authors nothing inline"
  - "exits Discover with research evidence, not insights or directional hypotheses"
forbidden_behaviors:
  - "writes an artifact"
repetition_count: 3
