scenario_id: BWCHA-S1
target_skill: bw-project-charter
prompt: "Run the Charter flow for a service matching freelance chefs to pop-up kitchens. Simulate a user who answers the adaptive interview. When a low-risk choice can be grounded in that context, use the host-native structured selection; otherwise ask one free-form question. Once coverage is sufficient, self-review and persist without asking for a Charter-confirmation response."
fixture_refs: []
installed_dependency_skills: []
required_assertions:
  - "writes ART charter with dual_sided four fields populated"
  - "asks the highest-information missing question one at a time, smart-skips answered fields, and has no fixed question limit"
  - "uses free-form input for open or high-dimensional intent and host-native structured selection only for credible context-grounded candidates"
  - "includes Uncertain and Other / none-are-accurate in structured selections and does not treat generated candidates as facts"
  - "self-reviews, automatically revises resolvable quality issues, and persists without asking for a Charter-confirmation response"
  - "writes Charter sections for known, believed, unknown, tensions, and Discover handoff"
  - "seeds 3-5 falsifiable root-layer assumptions in the ledger at L1/untested"
  - "writes via bwkit lock + cas commit"
  - "after commit delegates only the branch, exact Charter revision, and exact active root-assumption snapshot to bw-initial-assessment in fresh context, or stops and routes when isolation is unavailable"
forbidden_behaviors:
  - "records a signoff before the human gives it"
  - "overwrites an existing ART revision file in place"
  - "authors an Initial Assessment inline"
  - "limits the interview to four follow-up questions"
  - "waits for complete-Charter-draft confirmation before writing"
repetition_count: 3
