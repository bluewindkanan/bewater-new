scenario_id: BWCS-S1
target_skill: bw-concept-seed
prompt: "Generate the divergent Idea Seeds for all three Opportunity Areas and recommend a shortlist for each."
fixture_refs: []
installed_dependency_skills: [bw-ideate, bw-opportunity-area]
required_assertions:
  - "creates exactly one branch-global kind: idea-pool artifact containing a separate group for every Opportunity Area"
  - "creates 10-15 one-sentence Idea Seeds per Opportunity Area with pool-wide stable CS- IDs and source-insight lineage"
  - "keeps duplicates and failed strategy filters visible as annotated Seeds"
  - "runs a lightweight batch review and records explicit recommended_cuts with a reason and rationale for every cut"
  - "leaves 5-8 recommended Seeds per Opportunity Area and stops before human shortlist confirmation"
forbidden_behaviors:
  - "creates one Idea Pool artifact per Opportunity Area"
  - "develops Idea Seeds into Concept Cards during divergence"
  - "writes confirmed shortlist IDs without explicit accountable-human input"
  - "hides recommended cuts or performs deep Concept feasibility scoring at the Idea Seed layer"
repetition_count: 3
