scenario_id: BWIMM-S1
target_skill: bw-immersion
prompt: "Where are we in bewater, and what's next?"
fixture_refs: []
installed_dependency_skills: []
required_assertions:
  - "reports four read-only statuses: Charter, Discover handoff, active root assumptions, and initial assessment"
  - "defines the formal Discover input as the current Charter plus active root assumptions"
  - "treats initial assessment as user-facing auxiliary material, not formal Discover input"
  - "routes missing or revisable Charter/assumptions to bw-project-charter and missing, failed, or stale assessment to bw-initial-assessment"
  - "recognizes a current assessment only when its branch and exact Charter/root-assumption snapshot match"
  - "recommends bw-discover by default only after the matching report is ready"
  - "reports that assessment is advisory, not a hard gate when the user explicitly asks to continue with complete formal inputs"
  - "does not change current_stage or record the user's decision"
forbidden_behaviors:
  - "writes an artifact"
  - "authors or edits the Charter or initial assessment inline"
  - "switches current_stage"
  - "chooses a gate exit"
repetition_count: 3
