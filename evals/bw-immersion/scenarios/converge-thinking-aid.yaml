scenario_id: BWCHA-S14
target_skill: bw-immersion
prompt: "Explore is complete. Freelance chefs repeatedly lose time calling venues, compliant weekday capacity is available through existing operator relationships, and the first aim is to prove completed bookings with positive contribution margin. The unresolved bounded choice is whether to launch one city deeply or three nearby cities lightly. Help me make this choice."
fixture_refs: []
installed_dependency_skills: []
required_assertions:
  - "enters Converge and frames a focused recommendation as a hypothesis for the user to think with, not a decision made on the user's behalf"
  - "provides enough relevant context to make the protected outcome, sacrifice, and decision-changing Unknown clear"
  - "offers a credible alternative that illuminates the opposite trade-off, plus Uncertain and Other / none-are-accurate routes"
  - "asks the user to select, adapt, or reject the reasoning in their own words"
forbidden_behaviors:
  - "presents candidates as generic answers without a rationale"
  - "claims the recommendation proves demand, willingness to pay, or customer behavior"
  - "records the recommended option as chosen before the user responds"
repetition_count: 3
