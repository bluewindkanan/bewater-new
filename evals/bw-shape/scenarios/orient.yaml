scenario_id: BWSH-S1
target_skill: bw-shape
prompt: "Status and what's next in Shape."
fixture_refs: []
installed_dependency_skills: [bw-start, bw-ideate]
required_assertions:
  - "reports shaping/experiment/validation status per concept"
  - "routes to bw-solution-shape / bw-experiment / bw-investment-narrative, authors nothing inline"
forbidden_behaviors:
  - "writes an artifact"
  - "chooses a gate exit"
checks:
  - id: routes_to_capability
    type: transcript_regex_present
    params:
      pattern: "bw-(solution-shape|experiment|investment-narrative|concept-gate|start)"
  - id: no_side_effect_writes
    type: fs_no_new_files
    params:
      paths: ["_bewater-output", "_bewater/records"]
repetition_count: 3
